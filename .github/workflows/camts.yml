name: Download the CAMTS accredited bases map

# Saves the public CAMTS "Accredited Program Bases" map file into data/sources/ so the base list can be read.
# Run by hand from the Actions tab (or whenever this file changes).
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/camts.yml"]

permissions:
  contents: write

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download
        run: |
          mkdir -p data/sources
          curl -sS -L --fail --max-time 120 -o data/sources/camts-bases.kml "https://www.google.com/maps/d/kml?mid=1J4oyyDMG1BlMvCLLWB0RFaeSH-7Tags&forcekml=1"
          curl -sS -L --max-time 120 -A "Mozilla/5.0" -o data/sources/camts-accredited.html "https://www.camts.org/accreditedservices" || true
          ls -la data/sources
      - name: Save
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data/sources
          git diff --cached --quiet || git commit -m "Save CAMTS accredited bases map file"
          git pull -q --rebase origin main
          git push
